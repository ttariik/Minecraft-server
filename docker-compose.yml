version: '3.8'

services:
  minecraft-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minecraft-server
    restart: unless-stopped
    ports:
      - "25565:25565/tcp"
      - "25575:25575/tcp"
    environment:
      - SERVER_JAR=server.jar
      - MAX_RAM=2G
      - MIN_RAM=1G
      - SERVER_PORT=25565
      - WORLD_NAME=world
      - TZ=UTC
    volumes:
      - ./worlds:/minecraft/worlds
      - ./logs:/minecraft/logs
      - ./backups:/minecraft/backups
      - ./server.properties:/minecraft/server.properties:ro
    networks:
      - minecraft-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "java"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  web-dashboard:
    image: nginx:alpine
    container_name: minecraft-dashboard
    restart: unless-stopped
    ports:
      - "8888:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - minecraft-network
    depends_on:
      - minecraft-server

networks:
  minecraft-network:
    driver: bridge

