

services:
  mc-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minecraft-server
    restart: unless-stopped
    ports:
      - "25565:25565/tcp"
    environment:
      - SERVER_JAR=server.jar
      - MAX_RAM=2G
      - MIN_RAM=1G
      - SERVER_PORT=25565
      - WORLD_NAME=world
      - TZ=UTC
    volumes:
      - minecraft-worlds:/minecraft/worlds
      - minecraft-logs:/minecraft/logs
      - minecraft-backups:/minecraft/backups
      - minecraft-server-properties:/minecraft/server.properties:ro
    networks:
      - minecraft-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "java"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  web-dashboard:
    image: nginx:alpine
    container_name: minecraft-dashboard
    restart: unless-stopped
    ports:
      - "8888:80"
    volumes:
      - minecraft-index-html:/usr/share/nginx/html/index.html:ro
      - minecraft-nginx-conf:/etc/nginx/nginx.conf:ro
    networks:
      - minecraft-network
    depends_on:
      - mc-server

networks:
  minecraft-network:
    driver: bridge

volumes:
  minecraft-worlds:
  minecraft-logs:
  minecraft-backups:
  minecraft-server-properties:
  minecraft-index-html:
  minecraft-nginx-conf:

