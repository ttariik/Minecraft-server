<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }
        .status.online {
            background: #10b981;
            color: white;
        }
        .status.offline {
            background: #ef4444;
            color: white;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 20px;
        }
        .stat {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e5e7eb;
        }
        .stat:last-child {
            border-bottom: none;
        }
        .stat-label {
            color: #6b7280;
        }
        .stat-value {
            font-weight: bold;
            color: #111827;
        }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5568d3;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-secondary {
            background: #6b7280;
            color: white;
        }
        .btn-secondary:hover {
            background: #4b5563;
        }
        .logs {
            background: #1f2937;
            color: #d1d5db;
            padding: 20px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #6b7280;
        }
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Minecraft Server Dashboard</h1>
            <p>Server Status: <span id="serverStatus" class="status offline">Checking...</span></p>
        </header>

        <div class="grid">
            <div class="card">
                <h2>Server Information</h2>
                <div class="stat">
                    <span class="stat-label">Status</span>
                    <span id="statusValue" class="stat-value">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Players</span>
                    <span id="playerCount" class="stat-value">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Version</span>
                    <span id="serverVersion" class="stat-value">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Uptime</span>
                    <span id="uptime" class="stat-value">-</span>
                </div>
            </div>

            <div class="card">
                <h2>System Resources</h2>
                <div class="stat">
                    <span class="stat-label">CPU Usage</span>
                    <span id="cpuUsage" class="stat-value">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Memory Usage</span>
                    <span id="memoryUsage" class="stat-value">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Disk Usage</span>
                    <span id="diskUsage" class="stat-value">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Network</span>
                    <span id="networkStatus" class="stat-value">-</span>
                </div>
            </div>

            <div class="card">
                <h2>Server Actions</h2>
                <div class="actions">
                    <button class="btn-primary" onclick="startServer()">Start Server</button>
                    <button class="btn-danger" onclick="stopServer()">Stop Server</button>
                    <button class="btn-secondary" onclick="restartServer()">Restart</button>
                    <button class="btn-secondary" onclick="backupServer()">Backup</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Server Logs</h2>
            <div id="logs" class="logs">
                <div class="loading">Loading logs...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        
        async function fetchServerStatus() {
            try {
                const response = await fetch(`${API_BASE}/status`);
                const data = await response.json();
                
                document.getElementById('serverStatus').textContent = data.online ? 'Online' : 'Offline';
                document.getElementById('serverStatus').className = `status ${data.online ? 'online' : 'offline'}`;
                document.getElementById('statusValue').textContent = data.online ? 'Running' : 'Stopped';
                document.getElementById('playerCount').textContent = data.players ? `${data.players.online}/${data.players.max}` : '0/0';
                document.getElementById('serverVersion').textContent = data.version || '-';
                document.getElementById('uptime').textContent = data.uptime || '-';
            } catch (error) {
                document.getElementById('serverStatus').textContent = 'Offline';
                document.getElementById('serverStatus').className = 'status offline';
            }
        }

        async function fetchSystemInfo() {
            try {
                const response = await fetch(`${API_BASE}/system`);
                const data = await response.json();
                
                document.getElementById('cpuUsage').textContent = data.cpu ? `${data.cpu}%` : '-';
                document.getElementById('memoryUsage').textContent = data.memory ? `${data.memory.used}/${data.memory.total}` : '-';
                document.getElementById('diskUsage').textContent = data.disk ? `${data.disk.used}/${data.disk.total}` : '-';
                document.getElementById('networkStatus').textContent = data.network || '-';
            } catch (error) {
                console.error('Failed to fetch system info:', error);
            }
        }

        async function fetchLogs() {
            try {
                const response = await fetch(`${API_BASE}/logs`);
                const logs = await response.text();
                document.getElementById('logs').textContent = logs || 'No logs available';
            } catch (error) {
                document.getElementById('logs').textContent = 'Failed to load logs';
            }
        }

        async function startServer() {
            if (!confirm('Start the Minecraft server?')) return;
            try {
                const response = await fetch(`${API_BASE}/start`, { method: 'POST' });
                const data = await response.json();
                alert(data.message || 'Server start command sent');
                setTimeout(fetchServerStatus, 2000);
            } catch (error) {
                alert('Failed to start server');
            }
        }

        async function stopServer() {
            if (!confirm('Stop the Minecraft server?')) return;
            try {
                const response = await fetch(`${API_BASE}/stop`, { method: 'POST' });
                const data = await response.json();
                alert(data.message || 'Server stop command sent');
                setTimeout(fetchServerStatus, 2000);
            } catch (error) {
                alert('Failed to stop server');
            }
        }

        async function restartServer() {
            if (!confirm('Restart the Minecraft server?')) return;
            try {
                await fetch(`${API_BASE}/stop`, { method: 'POST' });
                await new Promise(resolve => setTimeout(resolve, 3000));
                await fetch(`${API_BASE}/start`, { method: 'POST' });
                setTimeout(fetchServerStatus, 2000);
            } catch (error) {
                alert('Failed to restart server');
            }
        }

        async function backupServer() {
            try {
                const response = await fetch(`${API_BASE}/backup`, { method: 'POST' });
                const data = await response.json();
                alert(data.message || 'Backup started');
            } catch (error) {
                alert('Failed to create backup');
            }
        }

        // Update data every 5 seconds
        setInterval(() => {
            fetchServerStatus();
            fetchSystemInfo();
        }, 5000);

        // Update logs every 10 seconds
        setInterval(fetchLogs, 10000);

        // Initial load
        fetchServerStatus();
        fetchSystemInfo();
        fetchLogs();
    </script>
</body>
</html>
